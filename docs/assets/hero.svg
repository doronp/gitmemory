<text x="1100" y="208" fill="#9198a1" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal" xml:space="preserve" text-anchor="end">user</text>
<text x="820" y="227" fill="#e6edf3" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal" xml:space="preserve" text-anchor="start">Don't add a retry loop around the</text>
