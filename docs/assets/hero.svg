</g>
<g class="q">
<text x="50" y="310" fill="#4493f8" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal" xml:space="preserve" text-anchor="start">you</text>
<text x="100" y="310" fill="#e6edf3" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal" xml:space="preserve" text-anchor="start">Why no retry loop?</text>
</g>
<g class="lost">
<text x="50" y="336" fill="#3fb950" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal" xml:space="preserve" text-anchor="start">agent</text>
<text x="100" y="336" fill="#f0883e" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal" xml:space="preserve" text-anchor="start">I have no record of that.</text>
</g>
