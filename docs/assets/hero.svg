<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 410" width="1160" height="410" role="img" aria-label="An agent is told not to add a retry loop; compaction drops that turn and the agent forgets it. gitmemory has committed the transcript bytes to git as contiguous segments, verify reports no hole, and recall returns the original turn with its byte offset.">
<style>
@keyframes c0{0%,3%{opacity:0} 6%{opacity:1} 37%{opacity:1} 41%,95%{opacity:0.18} 99%,100%{opacity:0}}
@keyframes c1{0%,11%{opacity:0} 14%{opacity:1} 37%{opacity:1} 41%,95%{opacity:0.18} 99%,100%{opacity:0}}
@keyframes c2{0%,19%{opacity:0} 22%{opacity:1} 37%{opacity:1} 41%,95%{opacity:0.18} 99%,100%{opacity:0}}
@keyframes c3{0%,25%{opacity:0} 28%{opacity:1} 37%{opacity:1} 41%,95%{opacity:0.18} 99%,100%{opacity:0}}
@keyframes cmp{0%,33%{opacity:0} 36%{opacity:1} 44%{opacity:1} 48%,95%{opacity:0.55} 99%,100%{opacity:0}}
@keyframes q{0%,47%{opacity:0} 50%{opacity:1} 95%{opacity:1} 99%,100%{opacity:0}}
@keyframes lost{0%,52%{opacity:0} 55%{opacity:1} 95%{opacity:1} 99%,100%{opacity:0}}
@keyframes s0{0%,7%{opacity:0} 10%{opacity:1} 95%{opacity:1} 99%,100%{opacity:0}}
@keyframes s1{0%,15%{opacity:0} 18%{opacity:1} 95%{opacity:1} 99%,100%{opacity:0}}
@keyframes s2{0%,40%{opacity:0} 44%{opacity:1} 95%{opacity:1} 99%,100%{opacity:0}}
@keyframes ok{0%,57%{opacity:0} 61%{opacity:1} 95%{opacity:1} 99%,100%{opacity:0}}
@keyframes cmd{0%,63%{opacity:0} 64%{opacity:1} 95%{opacity:1} 99%,100%{opacity:0}}
@keyframes type{0%,64%{transform:scaleX(1)} 72%,100%{transform:scaleX(0)}}
@keyframes r0{0%,75%{opacity:0} 78%{opacity:1} 95%{opacity:1} 99%,100%{opacity:0}}
@keyframes r1{0%,80%{opacity:0} 83%{opacity:1} 95%{opacity:1} 99%,100%{opacity:0}}
.c0{animation:c0 16s linear infinite}
.c1{animation:c1 16s linear infinite}
.c2{animation:c2 16s linear infinite}
.c3{animation:c3 16s linear infinite}
.cmp{animation:cmp 16s linear infinite}
.q{animation:q 16s linear infinite}
.lost{animation:lost 16s linear infinite}
.s0{animation:s0 16s linear infinite}
.s1{animation:s1 16s linear infinite}
.s2{animation:s2 16s linear infinite}
.ok{animation:ok 16s linear infinite}
.cmd{animation:cmd 16s linear infinite}
.type{transform-box:fill-box;transform-origin:right;animation:type 16s steps(24,end) infinite}
.r0{animation:r0 16s linear infinite}
.r1{animation:r1 16s linear infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1160" height="410" rx="14" fill="#0d1117"/>
<text x="40" y="42" fill="#9198a1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" xml:space="preserve" text-anchor="start">GITMEMORY</text>
<text x="40" y="72" fill="#e6edf3" font-size="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="normal" xml:space="preserve" text-anchor="start">What your agent forgets at compaction, gitmemory keeps: byte for byte, provably, locally.</text>
<rect x="30" y="100" width="340" height="262" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="50" y="130" fill="#9198a1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" xml:space="preserve" text-anchor="start">1  The agent's context window</text>
<rect x="410" y="100" width="340" height="262" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="430" y="130" fill="#9198a1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" xml:space="preserve" text-anchor="start">2  gitmemory commits the bytes</text>
<rect x="790" y="100" width="340" height="262" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="810" y="130" fill="#9198a1" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" xml:space="preserve" text-anchor="start">3  Recalled verbatim, with its address</text>
