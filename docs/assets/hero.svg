<text x="430" y="340" fill="#3fb950" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal" xml:space="preserve" text-anchor="start">0 problem(s)  no hole, no overlap</text>
