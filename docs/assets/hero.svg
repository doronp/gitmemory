<text x="50" y="165" fill="#4493f8" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal" xml:space="preserve" text-anchor="start">you</text>
<text x="100" y="165" fill="#e6edf3" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal" xml:space="preserve" text-anchor="start">Don't add a retry loop.</text>
</g>
<g class="c1">
<text x="50" y="191" fill="#3fb950" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal" xml:space="preserve" text-anchor="start">agent</text>
<text x="100" y="191" fill="#e6edf3" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal" xml:space="preserve" text-anchor="start">Dropped it; pass a request id.</text>
</g>
<g class="c2">
<text x="50" y="217" fill="#4493f8" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal" xml:space="preserve" text-anchor="start">you</text>
<text x="100" y="217" fill="#e6edf3" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal" xml:space="preserve" text-anchor="start">Now wire up the upload UI.</text>
</g>
<g class="c3">
<text x="50" y="243" fill="#3fb950" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal" xml:space="preserve" text-anchor="start">agent</text>
<text x="100" y="243" fill="#e6edf3" font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="normal" xml:space="preserve" text-anchor="start">Done. 14 files changed.</text>
</g>
