<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 104" width="440" height="104" role="img" aria-label="gitmemory">
  <!-- The mark: a byte range tiled by three segments with no hole and no overlap,
       each boundary a commit on the line below. -->
  <g fill="#4493f8">
    <rect x="4" y="22" width="30" height="26" rx="3" fill-opacity="0.35"/>
    <rect x="34" y="22" width="22" height="26" fill-opacity="0.6"/>
    <rect x="56" y="22" width="36" height="26" rx="3"/>
  </g>
  <path d="M4 72 H92" stroke="#9198a1" stroke-width="3" stroke-linecap="round"/>
  <g fill="#4493f8" stroke="#4493f8">
    <circle cx="34" cy="72" r="5.5"/>
    <circle cx="56" cy="72" r="5.5"/>
    <circle cx="92" cy="72" r="5.5"/>
  </g>
  <path d="M34 48 V66 M56 48 V66 M92 48 V66" stroke="#9198a1" stroke-width="1.5" stroke-dasharray="2 3"/>
  <text x="116" y="66" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="600" letter-spacing="-1">gitmemory</text>
</svg>
