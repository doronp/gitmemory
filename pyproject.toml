[project]
name = "gitmemory"
version = "0.1.0"
description = "Git-versioned, contiguity-checked memory for agents that keep a local, append-only, line-delimited transcript"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
authors = [{ name = "The gitmemory authors" }]
maintainers = [{ name = "doronp" }]
keywords = ["agent-memory", "llm-agents", "claude-code", "transcripts", "git", "retrieval", "bm25"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: System :: Archiving",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/doronp/gitmemory"
Documentation = "https://github.com/doronp/gitmemory/tree/main/docs"
Source = "https://github.com/doronp/gitmemory"
Issues = "https://github.com/doronp/gitmemory/issues"
Changelog = "https://github.com/doronp/gitmemory/blob/main/CHANGELOG.md"
Security = "https://github.com/doronp/gitmemory/security/policy"

[project.scripts]
gitmemory = "gitmemory.__main__:main"

[project.optional-dependencies]
# Kept out of the core so `gitmemory capture` and `gitmemory verify` stay dependency-free.
# The index itself needs nothing: SQLite FTS5 ships with CPython. These are the
# dense and rerank arms `bench/` scores BM25 against — a dependency each has to
# earn, not one the index takes on faith.
hybrid = ["model2vec>=0.8", "numpy>=2.0", "flashrank>=0.2"]
# `keybert` was here and is gone: it pulls torch and transformers whatever backend
# you hand it, which is 42 packages for a keyphrase list nothing downstream reads.
# `networkx` was here and is gone too — graphify owns the graph and brings its own.
# `numpy` is not optional: LexRank refuses to run without it.
# See docs/tasks/E5-dependency-verification.md for the closure counts and licences.
derive = ["sumy>=0.13", "numpy>=2.0", "graphifyy>=0.9.65"]
serve = ["datasette>=0.65,<1", "datasette-dashboards>=0.7", "datasette-render-markdown>=2.1"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitmemory"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Review agents get their own git worktree under here, and their scratch is
# theirs, not ours. Untracked, unignorable by git (a worktree is a checkout),
# and it should not be able to fail the project's lint.
# `.conformance` is somebody else's repository, cloned for its fixtures. Its
# lint is not ours to fail.
extend-exclude = [".claude", ".conformance"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests", "bench"]
pythonpath = ["src", "tests", "."]
# The corpus tests read a 277 MB third-party download, so they are opt-in:
# `pytest -m corpus` after `bench/fetch_longmemeval.sh`. Gating on the env var
# alone was not enough — following the fetch script's own instructions exports
# it, and the default suite then silently grew a multi-second JSON parse.
markers = ["corpus: needs the LongMemEval download (run with -m corpus)"]
addopts = "-m 'not corpus'"
