[project]
name = "gitmemory"
version = "0.1.0"
description = "Git-versioned, contiguity-checked memory for coding agents"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = []

[project.scripts]
gitmemory = "gitmemory.__main__:main"

[project.optional-dependencies]
# Kept out of the core so `gitmemory capture` and `gitmemory verify` stay dependency-free.
index = ["model2vec>=0.8", "numpy>=2.0", "flashrank>=0.2"]
derive = ["sumy>=0.11", "keybert>=0.9", "networkx>=3.4"]
serve = ["datasette>=0.65,<1", "datasette-dashboards>=0.7", "datasette-render-markdown>=2.1"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gitmemory"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
